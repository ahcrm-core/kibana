name: Kibana 292645 overflow-count First Red

on:
  push:
    branches:
      - test/292645-overflow-count-first-red
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overflow-count-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify overflow count is rendered end to end
        shell: python
        run: |
          from pathlib import Path
          import re

          service_link = Path("x-pack/solutions/observability/plugins/apm/public/components/shared/links/apm/service_link/index.tsx").read_text()
          message = Path("x-pack/solutions/observability/plugins/apm/public/components/shared/links/apm/max_groups_message.tsx").read_text()

          failures = []

          if "serviceOverflowCount?: number;" not in service_link:
              failures.append("ServiceLink has no serviceOverflowCount prop")

          signature = re.search(r"export function ServiceLink\s*\(\s*\{(?P<props>.*?)\}\s*:\s*ServiceLinkProps\s*\)", service_link, re.S)
          if not signature or "serviceOverflowCount" not in signature.group("props"):
              failures.append("ServiceLink does not consume serviceOverflowCount")

          if "<MaxGroupsMessage serviceOverflowCount={serviceOverflowCount} />" not in service_link:
              failures.append("ServiceLink does not forward serviceOverflowCount to MaxGroupsMessage")

          if not re.search(r"export function MaxGroupsMessage\s*\(\s*\{\s*serviceOverflowCount\s*,?\s*\}", message, re.S):
              failures.append("MaxGroupsMessage does not accept serviceOverflowCount")

          if "serviceOverflowCount && serviceOverflowCount > 0" not in message:
              failures.append("MaxGroupsMessage does not guard count-aware copy to positive overflow")

          if "{serviceOverflowCount, plural," not in message or "additional service" not in message:
              failures.append("MaxGroupsMessage has no pluralized count-aware overflow copy")

          if failures:
              print("CONTRACT_FAIL")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)

          print("CONTRACT_PASS")
